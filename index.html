    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Tab switching logic
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-800', 'text-amber-300');
                btn.classList.add('text-emerald-200');
            });

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            const activeBtn = document.getElementById('nav-' + tabName);
            activeBtn.classList.add('bg-emerald-800', 'text-amber-300');
        }

        // Search Herb filter
        function filterHerbs() {
            const input = document.getElementById('herb-search').value.toLowerCase();
            const cards = document.querySelectorAll('.herb-card');

            cards.forEach(card => {
                const name = card.querySelector('.herb-name').innerText.toLowerCase();
                if (name.includes(input)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Simulate brewing process
        function simulateBrew() {
            const display = document.getElementById('timer-display');
            let progress = 0;
            display.innerText = "0%";
            
            const interval = setInterval(() => {
                progress += 10;
                display.innerText = progress + "%";
                if(progress >= 100) {
                    clearInterval(interval);
                    alert("Đã hoàn tất sắc thuốc tự động!");
                }
            }, 400);
        }

        // Appointment Form Handler
        function handleAppointment(e) {
            e.preventDefault();
            alert("Đã gửi đăng ký lịch tái khám thành công! Thầy thuốc sẽ xác nhận sớm.");
        }
    </script>
